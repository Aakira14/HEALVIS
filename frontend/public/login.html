<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>HEALVIS - Login</title>
    
    <!-- Tailwind CSS: use local built file `styles.tailwind.css` in production/build -->
    <link rel="stylesheet" href="styles.tailwind.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Fira+Code:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .login-card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 40px rgba(192, 132, 252, 0.1);
            animation: slideUp 0.8s ease-out;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-logo .logo-bracket {
            color: #a78bfa;
            font-size: 1.5rem;
        }
        
        .login-logo .logo-text {
            font-family: 'Fira Code', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #c084fc 0%, #a78bfa 50%, #67e8f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .login-title {
            font-family: 'Fira Code', monospace;
            font-size: 1.5rem;
            color: #f1f5f9;
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        
        .login-subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #c084fc 0%, #a78bfa 50%, #67e8f9 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Tajawal', sans-serif;
        }
        
        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(192, 132, 252, 0.4);
        }
        
        .google-btn:active {
            transform: translateY(0);
        }
        
        .google-btn i {
            font-size: 1.2rem;
        }
        
        .login-divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: #64748b;
            font-size: 0.85rem;
        }
        
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #334155;
        }
        
        .login-divider span {
            padding: 0 1rem;
            white-space: nowrap;
        }
        
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #a78bfa;
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            transition: color 0.2s ease;
        }
        
        .back-link:hover {
            color: #c084fc;
        }
        
        .login-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
        }
        
        .logout-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #f87171;
            background: none;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s ease;
            font-family: 'Tajawal', sans-serif;
        }
        
        .logout-link:hover {
            color: #ef4444;
        }
        
        .security-note {
            text-align: center;
            margin-top: 1.5rem;
            color: #64748b;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .security-note i {
            color: #86efac;
        }
        
        /* Floating particles for login page */
        .login-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .login-particle {
            position: absolute;
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            color: #c084fc;
            opacity: 0.1;
            animation: floatParticle 15s infinite ease-in-out;
        }
        
        @keyframes floatParticle {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10%, 90% {
                opacity: 0.1;
            }
            50% {
                transform: translateY(-100px) rotate(180deg);
                opacity: 0.2;
            }
        }
    </style>
</head>
<body class="body-main" data-theme="dark" data-lang="en" data-dir="ltr">
    
    <div class="login-container">
        <!-- Background with particles -->
        <div class="login-background">
            <div class="code-grid-bg"></div>
            <div class="login-particles" id="loginParticles"></div>
        </div>
        
        <!-- Login Card -->
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-bracket"><</span>
                <span class="logo-text">HEALVIS</span>
                <span class="logo-bracket">/></span>
            </div>
            
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to continue your health journey</p>
            
            <button class="google-btn" id="googleLoginBtn">
                <i class="fab fa-google"></i>
                <span>Continue with Google</span>
            </button>
            
            <div class="login-divider">
                <span>Secure Authentication</span>
            </div>
            
            <div class="security-note">
                <i class="fas fa-shield-alt"></i>
                <span>Your data is encrypted and secure</span>
            </div>
            
            <div class="login-actions">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Home</span>
                </a>
                <button class="logout-link" id="logoutBtn" style="display: none;" onclick="handleLogout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script>
        // Generate floating particles
        function generateLoginParticles() {
            const particlesContainer = document.getElementById('loginParticles');
            if (!particlesContainer) return;
            
            const codeSymbols = ['{', '}', '[', ']', '(', ')', '<', '>', '/', '*', '=', '+', '-', ';', ':', '&', '|', '%', '$', '#', '@'];
            const particleCount = 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'login-particle';
                particle.textContent = codeSymbols[Math.floor(Math.random() * codeSymbols.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Firebase Configuration
        const firebaseConfig = {
        apiKey: prompt("Enter your Firebase API Key:"),
        authDomain: prompt("Enter your Firebase Auth Domain:"),
        projectId: prompt("Enter your Firebase Project ID:"),
        storageBucket: prompt("Enter your Firebase Storage Bucket:"),
        messagingSenderId: prompt("Enter your Messaging Sender ID:"),
        appId: prompt("Enter your App ID:"),
        measurementId: prompt("Enter your Measurement ID:")
       };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // Handle Google Sign-In with Firebase
        function handleGoogleSignIn() {
            const btn = document.getElementById('googleLoginBtn');
            
            // Show loading state
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Connecting...</span>';
            btn.disabled = true;
            
            // Create Google auth provider
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.addScope('email');
            provider.addScope('profile');
            
            // Sign in with popup
            auth.signInWithPopup(provider)
                .then((result) => {
                    const user = result.user;
                    console.log('User signed in:', user);
                    
                    // Store user info in localStorage
                    localStorage.setItem('healvis_user', JSON.stringify({
                        name: user.displayName,
                        email: user.email,
                        picture: user.photoURL,
                        uid: user.uid,
                        loggedIn: true,
                        loginTime: new Date().toISOString(),
                        provider: 'google'
                    }));
                    
                    // Show success state
                    btn.innerHTML = '<i class="fas fa-check"></i><span>Successfully Logged In!</span>';
                    btn.style.background = 'linear-gradient(135deg, #86efac 0%, #67e8f9 100%)';
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                })
                .catch((error) => {
                    console.error('Google Sign-In Error:', error);
                    console.error('Error Code:', error.code);
                    console.error('Error Message:', error.message);
                    console.error('Error Details:', error);
                    
                    // Show error state with more specific message
                    let errorMessage = 'Login Failed - Try Again';
                    if (error.code === 'auth/unauthorized-domain') {
                        errorMessage = 'Domain Not Authorized';
                    } else if (error.code === 'auth/popup-closed-by-user') {
                        errorMessage = 'Login Cancelled';
                    } else if (error.code === 'auth/network-request-failed') {
                        errorMessage = 'Network Error';
                    }
                    
                    btn.innerHTML = `<i class="fas fa-exclamation-triangle"></i><span>${errorMessage}</span>`;
                    btn.style.background = 'linear-gradient(135deg, #f87171 0%, #fb923c 100%)';
                    
                    // Reset button after 5 seconds
                    setTimeout(() => {
                        btn.innerHTML = '<i class="fab fa-google"></i><span>Continue with Google</span>';
                        btn.style.background = 'linear-gradient(135deg, #c084fc 0%, #a78bfa 50%, #67e8f9 100%)';
                        btn.disabled = false;
                    }, 5000);
                });
        }
        
        // Check if user is already logged in
        function checkLoginStatus() {
            const userData = localStorage.getItem('healvis_user');
            if (userData) {
                const user = JSON.parse(userData);
                if (user.loggedIn && user.name) {
                    // User is already logged in, show welcome message
                    document.querySelector('.login-subtitle').textContent = 
                        `Welcome back, ${user.name.split(' ')[0]}!`;
                    document.getElementById('googleLoginBtn').innerHTML = 
                        '<i class="fas fa-user-check"></i><span>Already Logged In</span>';
                    document.getElementById('googleLoginBtn').style.background = 
                        'linear-gradient(135deg, #86efac 0%, #67e8f9 100%)';
                    document.getElementById('googleLoginBtn').disabled = true;
                    
                    // Show logout button
                    document.getElementById('logoutBtn').style.display = 'flex';
                    
                    // Add option to go to dashboard
                    const dashboardLink = document.createElement('a');
                    dashboardLink.href = 'dashboard.html';
                    dashboardLink.className = 'back-link';
                    dashboardLink.style.marginTop = '1rem';
                    dashboardLink.innerHTML = '<i class="fas fa-rocket"></i><span>Go to Dashboard</span>';
                    document.querySelector('.login-actions').appendChild(dashboardLink);
                }
            }
        }
        
        // Handle logout
        function handleLogout() {
            localStorage.removeItem('healvis_user');
            location.reload();
        }
        
        // Set up auth state listener
        function setupAuthListener() {
            auth.onAuthStateChanged((user) => {
                if (user) {
                    console.log('User is signed in:', user.email);
                } else {
                    console.log('User is signed out');
                }
            });
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            generateLoginParticles();
            checkLoginStatus();
            setupAuthListener();
            
            // Check if Firebase loaded properly
            if (typeof firebase === 'undefined') {
                console.error('Firebase SDK not loaded!');
                document.getElementById('googleLoginBtn').innerHTML = '<i class="fas fa-exclamation-circle"></i><span>Firebase Not Loaded</span>';
                document.getElementById('googleLoginBtn').style.background = 'linear-gradient(135deg, #f87171 0%, #fb923c 100%)';
                return;
            }
            
            // Set up button click handler
            document.getElementById('googleLoginBtn').addEventListener('click', handleGoogleSignIn);
        });
    </script>
</body>
</html>
